[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluereacher"
version = "0.1.0"
description = "Official Python client for the Blue Reacher API: send iMessage from your CRM, app, or AI agent over a dedicated line."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Sagency International LLC (Blue Reacher)" }]
keywords = ["imessage", "sms", "rcs", "api", "sdk", "bluereacher", "messaging"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://docs.bluereacher.com"
Documentation = "https://docs.bluereacher.com"
Repository = "https://github.com/Blue-Reacher/bluereacher-python"
Issues = "https://github.com/Blue-Reacher/bluereacher-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bluereacher"]
